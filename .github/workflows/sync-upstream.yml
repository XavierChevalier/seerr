# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Sync upstream develop

# Rebase onto seerr-team/seerr@develop, open a PR (tests run), auto-merge when green.
# Never force-push develop directly: a broken sync must not publish :develop.
on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-upstream-develop
  cancel-in-progress: false

env:
  SYNC_BRANCH: chore/sync-upstream
  SYNC_PR_TITLE: 'chore(sync): upstream develop'

jobs:
  sync:
    name: Rebase onto seerr-team/seerr develop
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout develop
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: develop
          fetch-depth: 0

      - name: Rebase onto upstream develop
        id: sync
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/seerr-team/seerr.git
          git fetch upstream develop

          before="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor upstream/develop HEAD; then
            echo "status=up_to_date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rebase upstream/develop; then
            after="$(git rev-parse HEAD)"
            if [ "$before" = "$after" ]; then
              echo "status=up_to_date" >> "$GITHUB_OUTPUT"
            else
              echo "status=rebased" >> "$GITHUB_OUTPUT"
            fi
          else
            git rebase --abort || true
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Push sync branch
        if: steps.sync.outputs.status == 'rebased'
        run: |
          set -euo pipefail
          git push --force-with-lease origin "HEAD:refs/heads/${SYNC_BRANCH}"

      - name: Open or update PR and enable auto-merge
        if: steps.sync.outputs.status == 'rebased'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          body="$(cat <<EOF
          ## Summary
          Automatic rebase of this fork onto \`seerr-team/seerr@develop\`.

          Unit Tests and Lint must pass on this PR. Auto-merge is enabled; on merge,
          the \`develop\` push publishes \`ghcr.io/xavierchevalier/seerr:develop\`.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"

          existing="$(gh pr list --base develop --head "${SYNC_BRANCH}" --state open \
            --json number --jq '.[0].number // empty')"

          if [[ -n "${existing}" ]]; then
            gh pr edit "${existing}" --title "${SYNC_PR_TITLE}" --body "${body}"
            pr="${existing}"
            echo "Updated existing sync PR #${pr}"
          else
            url="$(gh pr create --base develop --head "${SYNC_BRANCH}" \
              --title "${SYNC_PR_TITLE}" --body "${body}")"
            pr="$(gh pr list --base develop --head "${SYNC_BRANCH}" --state open \
              --json number --jq '.[0].number')"
            echo "Created sync PR #${pr} (${url})"
          fi

          # Wait for PR checks (Unit Tests / Lint run on pull_request), then squash-merge.
          # This is the reliable auto-merge path without depending on branch-protection
          # required contexts. If GitHub auto-merge is enabled on the repo, prefer it.
          if gh pr merge "${pr}" --auto --squash --delete-branch 2>/dev/null; then
            echo "GitHub auto-merge enabled on #${pr} (will land when required checks pass)"
          else
            echo "Waiting for PR checks on #${pr}, then merging"
            gh pr checks "${pr}" --watch --interval 30
            gh pr merge "${pr}" --squash --delete-branch
          fi

      - name: Open issue on rebase conflict
        if: failure() && steps.sync.outputs.status == 'conflict'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = 'Upstream sync conflict on develop';
            const body = [
              'Automatic rebase of this fork onto `seerr-team/seerr@develop` failed due to conflicts.',
              '',
              'Resolve locally, then open (or refresh) the sync PR — do **not** force-push `develop`:',
              '```bash',
              'git fetch origin develop',
              'git checkout develop',
              'git pull --ff-only origin develop',
              'git remote add upstream https://github.com/seerr-team/seerr.git || true',
              'git fetch upstream develop',
              'git checkout -B chore/sync-upstream',
              'git rebase upstream/develop',
              '# resolve conflicts, then:',
              'git push --force-with-lease origin chore/sync-upstream',
              'gh pr create --base develop --head chore/sync-upstream \\',
              '  --title "chore(sync): upstream develop" || gh pr merge --auto --squash',
              '```',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 20,
            });

            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              console.log(`Open conflict issue already exists: #${existing.number}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
