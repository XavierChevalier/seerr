---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Sync upstream develop

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream-develop
  cancel-in-progress: false

jobs:
  sync:
    name: Rebase onto seerr-team/seerr develop
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout develop
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: develop
          fetch-depth: 0

      - name: Rebase onto upstream develop
        id: sync
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/seerr-team/seerr.git
          git fetch upstream develop

          before="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor upstream/develop HEAD; then
            echo "status=up_to_date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rebase upstream/develop; then
            after="$(git rev-parse HEAD)"
            if [ "$before" = "$after" ]; then
              echo "status=up_to_date" >> "$GITHUB_OUTPUT"
            else
              echo "status=rebased" >> "$GITHUB_OUTPUT"
            fi
          else
            git rebase --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Push develop
        if: steps.sync.outputs.status == 'rebased'
        run: git push --force-with-lease origin develop

      - name: Trigger image rebuild
        if: steps.sync.outputs.status == 'rebased'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: 'develop',
            });

      - name: Open issue on rebase conflict
        if: failure() && steps.sync.outputs.status == 'conflict'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = 'Upstream sync conflict on develop';
            const body = [
              'Automatic rebase of this fork onto `seerr-team/seerr@develop` failed due to conflicts.',
              '',
              'Resolve locally (no merge commit):',
              '```bash',
              'git fetch origin develop',
              'git checkout develop',
              'git pull --ff-only origin develop',
              'git remote add upstream https://github.com/seerr-team/seerr.git',
              'git fetch upstream develop',
              'git rebase upstream/develop',
              '# resolve conflicts, then:',
              'git push --force-with-lease origin develop',
              '```',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 20,
            });

            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              console.log(`Open conflict issue already exists: #${existing.number}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
